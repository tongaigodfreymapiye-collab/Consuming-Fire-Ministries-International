<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070c"><link rel="icon" type="image/svg+xml" href="favicon.svg"><title>CFMI Live Projection</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:white;font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center}.screen{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#101827;background-size:cover;background-position:center;overflow:hidden}.screen:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}.content{position:relative;z-index:1;width:92%;max-height:90%;overflow:hidden;white-space:pre-wrap;text-shadow:0 3px 12px #000;font-family:Georgia,'Times New Roman',serif;font-size:clamp(28px,5vw,76px);line-height:1.3}.ref{display:block;color:#f1c15e;font:700 clamp(16px,2vw,28px) Arial,sans-serif;letter-spacing:.08em;margin-top:2.2vh}.announcement-title{color:#f1c15e;font-size:1.1em;font-weight:bold;margin-bottom:.5em}.media{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:contain;background:#05070c}.overlay{position:absolute;z-index:4;left:4%;right:4%;bottom:6%;padding:2.2% 3%;border-radius:12px;background:rgba(5,8,15,.78);color:#fff;text-align:center;white-space:pre-wrap;text-shadow:0 2px 8px #000;font:600 clamp(22px,3vw,48px)/1.3 Georgia,serif;pointer-events:none}.overlay strong{display:block;color:#f1c15e;font-size:1.15em;margin-bottom:.25em}.timer{position:absolute;z-index:3;top:2vh;right:2vw;background:rgba(0,0,0,.55);padding:.4em .7em;border-radius:8px;font:700 clamp(20px,3vw,42px) Arial,sans-serif;color:#fff}.brand{position:absolute;z-index:2;left:2vw;bottom:1.5vh;font:700 12px Arial,sans-serif;letter-spacing:.22em;color:rgba(255,255,255,.72)}.black{background:#000!important}.black:before{display:none}.blank{font-size:clamp(18px,2vw,30px);color:rgba(255,255,255,.5);font-family:Arial,sans-serif}.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;width:100%;height:100%;padding:5vw;text-align:center}.welcome img{width:min(18vw,220px);max-height:28vh;object-fit:contain;filter:drop-shadow(0 5px 14px rgba(0,0,0,.4))}.welcome .vision-title{font:500 clamp(26px,4.2vw,64px)/1.15 Georgia,serif;color:#fff}.welcome .vision-text{max-width:1100px;font:italic clamp(20px,2.6vw,40px)/1.35 Georgia,serif;color:#f5c56b}.welcome .scripture{font:600 clamp(12px,1.3vw,18px) Arial,sans-serif;letter-spacing:.15em;color:rgba(255,255,255,.82)}.fullscreen-hint{position:absolute;z-index:10;top:2vh;right:2vw;background:rgba(8,12,20,.85);padding:12px 16px;border:1px solid rgba(255,255,255,.3);border-radius:8px;font:600 14px Arial,sans-serif;color:white;cursor:pointer}.fullscreen-hint[hidden]{display:none}
@keyframes cfmiMotionDrift{0%{background-position:0% 50%;filter:hue-rotate(0deg)}50%{background-position:100% 50%;filter:hue-rotate(9deg)}100%{background-position:0% 50%;filter:hue-rotate(0deg)}}.screen.motion-bg{background-size:300% 300%!important;animation:cfmiMotionDrift 24s ease-in-out infinite}.screen.motion-bg:before{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.08),rgba(0,0,0,.46))}.screen.motion-embers{background-image:radial-gradient(ellipse at 15% 80%,#e6a33c 0%,transparent 25%),radial-gradient(ellipse at 80% 20%,#9b4d25 0%,transparent 28%),linear-gradient(130deg,#090d1b,#4b1f23,#17172c)}.screen.motion-aurora{background-image:radial-gradient(ellipse at 20% 10%,#2cb99c 0%,transparent 35%),radial-gradient(ellipse at 80% 70%,#7657d5 0%,transparent 42%),linear-gradient(130deg,#041529,#0c3f51,#15113c)}.screen.motion-ocean{background-image:radial-gradient(ellipse at 20% 30%,#2ac6ce 0%,transparent 32%),radial-gradient(ellipse at 80% 80%,#174e9c 0%,transparent 38%),linear-gradient(130deg,#02172b,#075f78,#051b3a)}.screen.motion-gold{background-image:radial-gradient(ellipse at 80% 20%,#c99a39 0%,transparent 28%),radial-gradient(ellipse at 15% 85%,#394c78 0%,transparent 35%),linear-gradient(130deg,#070f20,#202b43,#5b401c)}.screen.motion-particles{background-image:radial-gradient(circle at 20% 30%,#f2d68c 0 1px,transparent 3px),radial-gradient(circle at 70% 65%,#b9d8ff 0 1px,transparent 3px),radial-gradient(ellipse at 50% 50%,#28385d,#070b1b 70%)}.background-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.screen.motion-bg .content{z-index:2}@media(prefers-reduced-motion:reduce){.screen.motion-bg{animation:none}}
</style></head><body><div class="screen" id="screen"><div class="content blank" id="content"><div class="welcome"><img src="assets/cfmi-logo-short.png" alt="Consuming Fire Ministries International logo"><div class="vision-text">“To seek and to find the lost and reconcile them to God through preaching the Gospel of Jesus Christ.”</div><div class="scripture">CONS​​UMING FIRE MINISTRIES INTERNATIONAL</div></div></div><button class="fullscreen-hint" id="fullscreen-hint" hidden>Click to enter full screen</button><div class="overlay" id="overlay" hidden></div><div class="timer" id="timer" hidden>05:00</div><div class="brand">CONSUMING FIRE MINISTRIES INTERNATIONAL</div></div>
<script src="assets/bible/kjv-data.js"></script>
<script>
const backgrounds={navy:'linear-gradient(135deg,#101827,#202f48 55%,#8a6426)',sunrise:'linear-gradient(135deg,#401b48,#c04b45 48%,#f3b64b)',ocean:'linear-gradient(135deg,#061c36,#087e8b 55%,#73d2de)',forest:'linear-gradient(135deg,#071f1b,#1c5944 55%,#9c9d52)',purple:'linear-gradient(135deg,#1b1037,#5b328a 55%,#c28cda)',black:'#050505',mountains:'linear-gradient(160deg,#172d50,#7ba5bd 45%,#f7c77b 46%,#18283c)',lake:'linear-gradient(180deg,#f7c9a4,#9fc9d4 38%,#2f6678 39%,#061a2b)',desert:'linear-gradient(160deg,#8b4e44,#e5a45c 45%,#f5d18b 46%,#512f3d)',waterfall:'linear-gradient(115deg,#163b3c,#4c8d8a 35%,#c2e3d8 48%,#122e34)',meadow:'linear-gradient(180deg,#8ec8ed,#e4eec8 48%,#74a75b 49%,#28533b)','night-sky':'linear-gradient(180deg,#030617,#152d56 60%,#4c557b 78%,#101a2a)',galaxy:'radial-gradient(ellipse at 70% 35%,#f3a6df,#7048a8 18%,#251a55 45%,#070a1c)',autumn:'linear-gradient(160deg,#5d3745,#d16d3e 42%,#e8b75d 43%,#263b32)',winter:'linear-gradient(160deg,#1c395d,#9fc6dc 42%,#eef6f8 43%,#3e6076)',spring:'linear-gradient(160deg,#9ed7e5,#f8e5bd 44%,#a5c879 45%,#477b55)',coast:'linear-gradient(160deg,#7bbbd3,#e8d6bd 47%,#5e9d9c 48%,#1d526a)',island:'linear-gradient(180deg,#76d0ed,#c8f0e8 44%,#31a7a1 45%,#087b83 69%,#f0d5a2 70%,#b99561)',savannah:'linear-gradient(180deg,#8ac5e5,#f5d28a 48%,#c6a452 49%,#36452d)',baobab:'linear-gradient(180deg,#3c235f,#c45165 42%,#f5a45f 65%,#563b35 66%,#161f25)',hills:'linear-gradient(165deg,#a9d8ef,#e5efcf 42%,#9bc078 43%,#25503c)',river:'linear-gradient(155deg,#a7d8e7,#c4d9bc 40%,#3d8d9a 41%,#15546a)',rain:'linear-gradient(130deg,#082f2e,#1f6654 35%,#8bbd8c 48%,#062523)',lavender:'linear-gradient(180deg,#a4cce8,#f0d6ee 45%,#8c79b7 46%,#28384c)','sand-dunes':'linear-gradient(160deg,#79a9c5,#e8c98f 44%,#c59b60 45%,#9d704d)',canyon:'linear-gradient(160deg,#7eb9d6,#e9c6a1 36%,#b65e42 37%,#743d3b)',clouds:'linear-gradient(180deg,#4d79a4,#a7c7df 35%,#eef1f0 54%,#46627d)',aurora:'linear-gradient(145deg,#04152e,#104b59 40%,#28a18b 52%,#574e9e,#080d2b)','golden-hour':'linear-gradient(180deg,#6c4c77,#e68a68 43%,#f9d69c 63%,#303846)',dusk:'linear-gradient(180deg,#18244e,#465f8c 48%,#c47d8a 68%,#2b334d)','motion-embers':'radial-gradient(ellipse at 15% 80%,#e6a33c 0%,transparent 25%),radial-gradient(ellipse at 80% 20%,#9b4d25 0%,transparent 28%),linear-gradient(130deg,#090d1b,#4b1f23,#17172c)','motion-aurora':'radial-gradient(ellipse at 20% 10%,#2cb99c 0%,transparent 35%),radial-gradient(ellipse at 80% 70%,#7657d5 0%,transparent 42%),linear-gradient(130deg,#041529,#0c3f51,#15113c)','motion-ocean':'radial-gradient(ellipse at 20% 30%,#2ac6ce 0%,transparent 32%),radial-gradient(ellipse at 80% 80%,#174e9c 0%,transparent 38%),linear-gradient(130deg,#02172b,#075f78,#051b3a)','motion-gold':'radial-gradient(ellipse at 80% 20%,#c99a39 0%,transparent 28%),radial-gradient(ellipse at 15% 85%,#394c78 0%,transparent 35%),linear-gradient(130deg,#070f20,#202b43,#5b401c)','motion-particles':'radial-gradient(circle at 20% 30%,#f2d68c 0 1px,transparent 3px),radial-gradient(circle at 70% 65%,#b9d8ff 0 1px,transparent 3px),radial-gradient(ellipse at 50% 50%,#28385d,#070b1b 70%)'};
const $=id=>document.getElementById(id);let lastStamp=0;let timerInterval=null;
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){let d;try{d=JSON.parse(localStorage.getItem('cfmi-live-state')||'{}')}catch{return}if(!d||((d.updatedAt===lastStamp)&&!d.revision))return;lastStamp=d.updatedAt;const screen=$('screen'),content=$('content');screen.classList.toggle('black',!!d.blackout);screen.classList.toggle('motion-bg',String(d.background||'').startsWith('motion-')&&!d.customBackgroundVideoUrl&&!d.customBackgroundUrl);['motion-embers','motion-aurora','motion-ocean','motion-gold','motion-particles'].forEach(c=>screen.classList.toggle(c,d.background===c&&!d.customBackgroundVideoUrl&&!d.customBackgroundUrl));screen.querySelector('.background-video')?.remove();if(d.customBackgroundVideoUrl){const bgv=document.createElement('video');bgv.className='background-video';bgv.src=d.customBackgroundVideoUrl;bgv.autoplay=true;bgv.loop=true;bgv.muted=true;bgv.playsInline=true;screen.prepend(bgv);screen.style.background='transparent'}else if(d.customBackgroundUrl){screen.style.background=`linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),url('${d.customBackgroundUrl}') center/cover`}else{screen.style.background=backgrounds[d.background]||backgrounds.navy}$('timer').hidden=!(d.timerRunning||d.timerRemaining>0);$('timer').textContent=fmt(d.timerRunning&&d.timerEnd?Math.max(0,(d.timerEnd-Date.now())/1000):d.timerRemaining);content.innerHTML='';
const overlay=$('overlay');overlay.innerHTML='';overlay.hidden=!(d.overlay&&!d.blackout);if(d.overlay&&!d.blackout){const h=document.createElement('strong');h.textContent=d.overlay.title||'Announcement';overlay.appendChild(h);const b=document.createElement('span');b.textContent=d.overlay.text||'';overlay.appendChild(b)}if(d.blackout){content.textContent='';return}const it=d.item;if(!it){content.className='content blank';content.innerHTML='<div class="welcome"><img src="assets/cfmi-logo-short.png" alt="Consuming Fire Ministries International logo"><div class="vision-text">“To seek and to find the lost and reconcile them to God through preaching the Gospel of Jesus Christ.”</div><div class="scripture">CONSUMING FIRE MINISTRIES INTERNATIONAL</div></div>';return}
if(['verse','text','announcement'].includes(it.type)){content.className='content';if(it.type==='announcement'){const h=document.createElement('div');h.className='announcement-title';h.textContent=it.title||'Announcement';content.appendChild(h);const b=document.createElement('div');b.textContent=it.text||'';content.appendChild(b)}else{content.textContent=it.text||it.title||'';if(it.reference){const r=document.createElement('span');r.className='ref';r.textContent=it.reference;content.appendChild(r)}}return}
if(it.type==='image'||it.type==='video'||it.type==='audio'||it.type==='pdf'){const el=document.createElement(it.type==='pdf'?'iframe':it.type);el.className='media';el.src=it.type==='pdf'&&it.page?((it.url||'')+'#page='+it.page):(it.url||'');if(it.type==='video'||it.type==='audio'){el.controls=true;if(it.type==='video')el.autoplay=false}if(it.type==='pdf')el.title=it.title||'PDF slide';content.appendChild(el);return}content.className='content';content.textContent=it.type==='ppt'?(it.title+'\n\nPowerPoint files cannot be rendered directly by this browser. Export the presentation to PDF and add the PDF instead.'):it.type==='file'?(it.title+'\n\nThis file type cannot be projected directly in the browser. Open or convert it to PDF first.'):it.title||'CFMI';}
const fullHint=$('fullscreen-hint');async function enterProjectionFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();fullHint.hidden=true}catch(e){fullHint.hidden=false}}fullHint.addEventListener('click',enterProjectionFullscreen);if(new URLSearchParams(location.search).get('fullscreen')==='1'){setTimeout(enterProjectionFullscreen,250)}function liveBibleVerseList(){
 const bible=window.CFMI_BUNDLED_KJV||{}, verses=[];
 for(const [bookName,book] of Object.entries(bible)){
  for(const [chapter,chapterData] of Object.entries(book.chapters||{})){
   for(const [verse,text] of Object.entries(chapterData||{})){
    verses.push({reference:`${bookName} ${chapter}:${verse}`,text});
   }
  }
 }
 return verses;
}
let liveBibleVerses=null;
function moveLiveBibleVerse(direction){
 let state;try{state=JSON.parse(localStorage.getItem('cfmi-live-state')||'{}')}catch{return}
 if(!state.item||state.item.type!=='verse'||!state.item.reference)return;
 if(!liveBibleVerses)liveBibleVerses=liveBibleVerseList();
 const currentRef=String(state.item.reference).match(/^(.+?)\s+(\d+):(\d+)/);
 if(!currentRef)return;
 const idx=liveBibleVerses.findIndex(v=>v.reference.toLowerCase()===`${currentRef[1]} ${currentRef[2]}:${currentRef[3]}`.toLowerCase());
 const next=idx+direction;
 if(idx<0||next<0||next>=liveBibleVerses.length)return;
 const verse=liveBibleVerses[next];
 state.item={...state.item,reference:verse.reference,text:verse.text,title:verse.reference};
 state.updatedAt=Date.now();state.revision=Number(state.revision||0)+1;
 try{
  localStorage.setItem('cfmi-live-state',JSON.stringify(state));
  if(window.BroadcastChannel){const channel=new BroadcastChannel('cfmi-live-output');channel.postMessage(state);channel.close()}
  render();
 }catch(err){console.warn('Could not update live verse',err)}
}
document.addEventListener('keydown',e=>{
 if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;
 if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();moveLiveBibleVerse(1);return}
 if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();moveLiveBibleVerse(-1);return}
 if(e.key.toLowerCase()==='f'){e.preventDefault();enterProjectionFullscreen()}
 if(e.key==='Escape'&&document.fullscreenElement){fullHint.hidden=false}
});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)fullHint.hidden=false});
window.addEventListener('storage',e=>{if(e.key==='cfmi-live-state')render()});try{if(window.BroadcastChannel){const liveChannel=new BroadcastChannel('cfmi-live-output');liveChannel.addEventListener('message',e=>{try{const state=e.data;if(state&&state.revision){localStorage.setItem('cfmi-live-state',JSON.stringify(state));render()}}catch(err){console.warn('Live message sync failed',err)}})}}catch(err){console.warn('BroadcastChannel unavailable; using storage sync',err)}setInterval(()=>{try{const d=JSON.parse(localStorage.getItem('cfmi-live-state')||'{}');if(d.timerRunning&&d.timerEnd){$('timer').hidden=false;$('timer').textContent=fmt(Math.max(0,(d.timerEnd-Date.now())/1000));}else if(d.timerRemaining<=0){$('timer').hidden=true;}}catch{}},250);render();
</script></body></html>
