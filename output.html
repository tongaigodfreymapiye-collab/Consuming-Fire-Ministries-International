<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070c"><link rel="icon" type="image/svg+xml" href="favicon.svg"><title>CFMI Live Projection</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:white;font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center}.screen{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#101827;background-size:cover;background-position:center;overflow:hidden}.screen:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}.content{position:relative;z-index:1;width:92%;max-height:90%;overflow:hidden;white-space:pre-wrap;text-shadow:0 3px 12px #000;font-family:Georgia,'Times New Roman',serif;font-size:clamp(28px,5vw,76px);line-height:1.3}.ref{display:block;color:#f1c15e;font:700 clamp(16px,2vw,28px) Arial,sans-serif;letter-spacing:.08em;margin-top:2.2vh}.announcement-title{color:#f1c15e;font-size:1.1em;font-weight:bold;margin-bottom:.5em}.media{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:contain;background:#05070c}.overlay{position:absolute;z-index:4;left:4%;right:4%;bottom:6%;padding:2.2% 3%;border-radius:12px;background:rgba(5,8,15,.78);color:#fff;text-align:center;white-space:pre-wrap;text-shadow:0 2px 8px #000;font:600 clamp(22px,3vw,48px)/1.3 Georgia,serif;pointer-events:none}.overlay strong{display:block;color:#f1c15e;font-size:1.15em;margin-bottom:.25em}.timer{position:absolute;z-index:3;top:2vh;right:2vw;background:rgba(0,0,0,.55);padding:.4em .7em;border-radius:8px;font:700 clamp(20px,3vw,42px) Arial,sans-serif;color:#fff}.brand{position:absolute;z-index:2;left:2vw;bottom:1.5vh;font:700 12px Arial,sans-serif;letter-spacing:.22em;color:rgba(255,255,255,.72)}.black{background:#000!important}.black:before{display:none}.blank{font-size:clamp(18px,2vw,30px);color:rgba(255,255,255,.5);font-family:Arial,sans-serif}
</style></head><body><div class="screen" id="screen"><div class="content blank" id="content">CFMI · Live output<br><small>Open Projector Studio and select content.</small></div><div class="overlay" id="overlay" hidden></div><div class="timer" id="timer" hidden>05:00</div><div class="brand">CONSUMING FIRE MINISTRIES INTERNATIONAL</div></div>
<script>
const backgrounds={navy:'linear-gradient(135deg,#101827,#202f48 55%,#8a6426)',sunrise:'linear-gradient(135deg,#401b48,#c04b45 48%,#f3b64b)',ocean:'linear-gradient(135deg,#061c36,#087e8b 55%,#73d2de)',forest:'linear-gradient(135deg,#071f1b,#1c5944 55%,#9c9d52)',purple:'linear-gradient(135deg,#1b1037,#5b328a 55%,#c28cda)',black:'#050505',mountains:'linear-gradient(160deg,#172d50,#7ba5bd 45%,#f7c77b 46%,#18283c)',lake:'linear-gradient(180deg,#f7c9a4,#9fc9d4 38%,#2f6678 39%,#061a2b)',desert:'linear-gradient(160deg,#8b4e44,#e5a45c 45%,#f5d18b 46%,#512f3d)',waterfall:'linear-gradient(115deg,#163b3c,#4c8d8a 35%,#c2e3d8 48%,#122e34)',meadow:'linear-gradient(180deg,#8ec8ed,#e4eec8 48%,#74a75b 49%,#28533b)','night-sky':'linear-gradient(180deg,#030617,#152d56 60%,#4c557b 78%,#101a2a)',galaxy:'radial-gradient(ellipse at 70% 35%,#f3a6df,#7048a8 18%,#251a55 45%,#070a1c)',autumn:'linear-gradient(160deg,#5d3745,#d16d3e 42%,#e8b75d 43%,#263b32)',winter:'linear-gradient(160deg,#1c395d,#9fc6dc 42%,#eef6f8 43%,#3e6076)',spring:'linear-gradient(160deg,#9ed7e5,#f8e5bd 44%,#a5c879 45%,#477b55)',coast:'linear-gradient(160deg,#7bbbd3,#e8d6bd 47%,#5e9d9c 48%,#1d526a)',island:'linear-gradient(180deg,#76d0ed,#c8f0e8 44%,#31a7a1 45%,#087b83 69%,#f0d5a2 70%,#b99561)',savannah:'linear-gradient(180deg,#8ac5e5,#f5d28a 48%,#c6a452 49%,#36452d)',baobab:'linear-gradient(180deg,#3c235f,#c45165 42%,#f5a45f 65%,#563b35 66%,#161f25)',hills:'linear-gradient(165deg,#a9d8ef,#e5efcf 42%,#9bc078 43%,#25503c)',river:'linear-gradient(155deg,#a7d8e7,#c4d9bc 40%,#3d8d9a 41%,#15546a)',rain:'linear-gradient(130deg,#082f2e,#1f6654 35%,#8bbd8c 48%,#062523)',lavender:'linear-gradient(180deg,#a4cce8,#f0d6ee 45%,#8c79b7 46%,#28384c)','sand-dunes':'linear-gradient(160deg,#79a9c5,#e8c98f 44%,#c59b60 45%,#9d704d)',canyon:'linear-gradient(160deg,#7eb9d6,#e9c6a1 36%,#b65e42 37%,#743d3b)',clouds:'linear-gradient(180deg,#4d79a4,#a7c7df 35%,#eef1f0 54%,#46627d)',aurora:'linear-gradient(145deg,#04152e,#104b59 40%,#28a18b 52%,#574e9e,#080d2b)','golden-hour':'linear-gradient(180deg,#6c4c77,#e68a68 43%,#f9d69c 63%,#303846)',dusk:'linear-gradient(180deg,#18244e,#465f8c 48%,#c47d8a 68%,#2b334d)'};
const $=id=>document.getElementById(id);let lastStamp=0;let lastContentStamp="";let timerInterval=null;
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){let d;try{d=JSON.parse(localStorage.getItem('cfmi-live-state')||'{}')}catch{return}if(!d||d.updatedAt===lastStamp)return;lastStamp=d.updatedAt;const screen=$('screen'),content=$('content');screen.classList.toggle('black',!!d.blackout);screen.style.background=d.customBackgroundUrl?`linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),url('${d.customBackgroundUrl}') center/cover`:backgrounds[d.background]||backgrounds.navy;$('timer').hidden=!(d.timerRunning||d.timerRemaining>0);$('timer').textContent=fmt(d.timerRunning&&d.timerEnd?Math.max(0,(d.timerEnd-Date.now())/1000):d.timerRemaining);const contentStamp=JSON.stringify({item:d.item||null,overlay:d.overlay||null,blackout:!!d.blackout,background:d.background,customBackgroundUrl:d.customBackgroundUrl||null});if(contentStamp===lastContentStamp)return;lastContentStamp=contentStamp;content.innerHTML='';
const overlay=$('overlay');overlay.innerHTML='';overlay.hidden=!(d.overlay&&!d.blackout);if(d.overlay&&!d.blackout){const h=document.createElement('strong');h.textContent=d.overlay.title||'Announcement';overlay.appendChild(h);const b=document.createElement('span');b.textContent=d.overlay.text||'';overlay.appendChild(b)}if(d.blackout){content.textContent='';return}const it=d.item;if(!it){content.className='content blank';content.textContent='CFMI';return}
if(['verse','text','announcement'].includes(it.type)){content.className='content';if(it.type==='announcement'){const h=document.createElement('div');h.className='announcement-title';h.textContent=it.title||'Announcement';content.appendChild(h);const b=document.createElement('div');b.textContent=it.text||'';content.appendChild(b)}else{content.textContent=it.text||it.title||'';if(it.reference){const r=document.createElement('span');r.className='ref';r.textContent=it.reference;content.appendChild(r)}}return}
if(it.type==='image'||it.type==='video'||it.type==='audio'||it.type==='pdf'){const el=document.createElement(it.type==='pdf'?'iframe':it.type);el.className='media';el.src=it.type==='pdf'&&it.page?((it.url||'')+'#page='+it.page):(it.url||'');if(it.type==='video'||it.type==='audio'){el.controls=true;if(it.type==='video')el.autoplay=false}if(it.type==='pdf')el.title=it.title||'PDF slide';content.appendChild(el);return}content.className='content';content.textContent=it.type==='ppt'?(it.title+'\n\nPowerPoint files cannot be rendered directly by this browser. Export the presentation to PDF and add the PDF instead.'):it.type==='file'?(it.title+'\n\nThis file type cannot be projected directly in the browser. Open or convert it to PDF first.'):it.title||'CFMI';}
window.addEventListener('storage',e=>{if(e.key==='cfmi-live-state')render()});setInterval(()=>{try{const d=JSON.parse(localStorage.getItem('cfmi-live-state')||'{}');if(d.timerRunning&&d.timerEnd){$('timer').hidden=false;$('timer').textContent=fmt(Math.max(0,(d.timerEnd-Date.now())/1000));}else if(d.timerRemaining<=0){$('timer').hidden=true;}}catch{}},250);render();
</script></body></html>
