<script>
const fullSources={
 salvation:{label:'Open the complete original teaching (PDF)',url:'assets/teachings/salvation-full-teaching.pdf'},
 bible:{label:'Open the complete uploaded book (PDF)',url:'assets/teachings/understanding-the-bible-full-book.pdf'},
 temptation:{label:'Open the complete original Bible study (PDF)',url:'assets/teachings/temptations-and-sin-full-teaching.pdf'},
 worship:{label:'Open the complete Music Ministry manual (PDF)',url:'assets/teachings/praise-and-worship-full-manual.pdf'},
 youth:{label:'Open the complete Youth Ministry manual (PDF)',url:'assets/teachings/youth-ministry-full-manual.pdf'},
 marriage:{label:'Open the complete Premarital Counselling manual (PDF)',url:'assets/teachings/premarital-preparation-full-manual.pdf'},
 discipline:{label:'Open the complete Church Discipline manual (PDF)',url:'assets/teachings/church-discipline-full-manual.pdf'}
};
const teachings={
salvation:{title:'What Must I Do to Be Saved?'},
bible:{title:'Understanding the Bible'},
temptation:{title:'Temptations and Sin'},
worship:{title:'Praise and Worship'},
youth:{title:'Youth Discipleship'},
marriage:{title:'Premarital Preparation'},
discipline:{title:'Church Discipline'}
};
const topicNav=[['salvation','Salvation'],['bible','Understanding the Bible'],['temptation','Temptations and Sin'],['worship','Praise & Worship'],['youth','Youth Discipleship'],['marriage','Premarital Preparation'],['discipline','Church Discipline']];
const nav=document.getElementById('topics'),article=document.getElementById('article'),search=document.getElementById('search');let current=new URLSearchParams(location.search).get('topic')||'salvation';
function renderNav(){const q=search.value.trim().toLowerCase();nav.innerHTML='';let count=0;topicNav.filter(([id,label])=>(label+' '+teachings[id].title).toLowerCase().includes(q)).forEach(([id,label])=>{count++;const b=document.createElement('button');b.textContent=label;b.className=id===current?'active':'';b.onclick=()=>selectTopic(id);nav.appendChild(b)});if(!count)nav.innerHTML='<div class="empty">No matching teachings. Try another topic.</div>'}
function selectTopic(id){if(!teachings[id]||!fullSources[id])id='salvation';current=id;history.replaceState(null,'','?topic='+encodeURIComponent(id));renderNav();const t=teachings[id];const source=fullSources[id];article.innerHTML='<h2>'+t.title+'</h2><div class="full-source"><p>Read the complete teaching below, or open it in a new tab or download it for offline reading.</p><p><a class="source-link" href="'+source.url+'" target="_blank" rel="noopener">Open full document ↗</a> <a class="source-link secondary" href="'+source.url+'" download>Download document ↓</a></p><iframe class="source-pdf" title="Full document: '+t.title+'" src="'+source.url+'#view=FitH" loading="lazy"></iframe></div>';window.scrollTo({top:0,behavior:'smooth'})}
search.addEventListener('input',renderNav);document.getElementById('year').textContent=new Date().getFullYear();selectTopic(current);
</script></body></html>
